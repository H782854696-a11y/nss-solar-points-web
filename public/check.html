<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Check your points · NSS Solar</title>
  <meta name="theme-color" content="#087A3E" />
  <meta name="description" content="Check your NSS Solar Rewards points balance, tier and recent activity. No app needed." />
  <!-- 顾客查询页不需要被搜索引擎收录 -->
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="/logo.png?v=3" />
  <link rel="stylesheet" href="/check.css?v=2" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <img class="brand" src="/logo.png?v=3" alt="NSS Solar" />
      <button class="lang-btn" id="langBtn" type="button" data-lang-label aria-label="Switch language">中文</button>
    </header>

    <!-- ============ 第一步：验证身份 ============ -->
    <main class="view" id="viewForm">
      <div class="hero">
        <h1 data-i18n="check.title">Check your points</h1>
        <p data-i18n="check.subtitle">See your balance, tier and recent activity</p>
      </div>

      <form class="card" id="lookupForm" novalidate>
        <div class="field">
          <label for="phone" data-i18n="check.phoneLabel">Mobile number</label>
          <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel"
                 placeholder="0917 123 4567" data-i18n-ph="check.phonePh" required />
        </div>
        <div class="field">
          <label for="pname" data-i18n="check.nameLabel">Name on the account</label>
          <input id="pname" name="name" type="text" autocomplete="name" autocapitalize="words"
                 placeholder="Last name or full name" data-i18n-ph="check.namePh" required />
        </div>
        <p class="hint" data-i18n="check.hint">Use the mobile number you gave at the store.</p>
        <div class="alert hidden" id="formError" role="alert"></div>
        <button class="btn-primary" id="submitBtn" type="submit" data-i18n="check.submit">Check my points</button>
      </form>

      <div class="note">
        <span class="note-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 3.2l7 2.8v5.4c0 4.4-2.9 8.1-7 9.4-4.1-1.3-7-5-7-9.4V6L12 3.2z" stroke="#087A3E" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="M8.9 12.1l2.1 2.1 4.1-4.3" stroke="#087A3E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <p data-i18n="check.privacy">Your points are private — both your mobile number and name must match.</p>
      </div>

      <footer class="page-footer">
        <p data-i18n="check.footerHelp">Need help? Ask any NSS Solar staff.</p>
        <p class="small" data-i18n="check.footerNote">Points are issued at the store where you shop.</p>
      </footer>
    </main>

    <!-- ============ 第二步：查询结果（由 check.js 渲染） ============ -->
    <main class="view hidden" id="viewResult"></main>
  </div>

  <script src="/i18n.js?v=14"></script>
  <script src="/check.js?v=3"></script>
</body>
</html>
