<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <!-- PWA 图标：iOS Safari 添加到主屏必须用 PNG apple-touch-icon（不支持 SVG）；
       manifest 内也提供 192/512 + maskable 位图，供 Android 安装与分享卡使用。 -->
  <link rel="apple-touch-icon" href="/pwa-icon-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/pwa-icon-192.png" />
  <link rel="icon" type="image/svg+xml" href="/pwa-icon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
<title data-i18n="nav.titleAttr">NSS Solar · 中控平台</title>
  <link rel="stylesheet" href="/styles.css?v=45" />
  <link rel="stylesheet" href="/tokens.css?v=1" />
  <link rel="stylesheet" href="/ui-review.css?v=7" />
</head>
<body>
  <!-- ============ 登录页 / Login（2026-09-25 摄影背景重构：全屏光伏电站 + 左品牌组 + 右玻璃登录卡） ============ -->
  <!-- ============ 登录页 / Login（2026-09-25 沉浸式居中版：全屏照片 + 单一中轴：logo→标题→深色面板；无分栏、无白卡、无营销文案） ============ -->
  <div id="loginPage" class="login-page">
    <div class="login-bg"></div>
    <div class="login-shade"></div>
    <button class="lang-btn lang-btn-floating" id="langBtnLogin" data-lang-label type="button" title=""></button>
    <div class="login-center">
      <img src="/logo-brand.png" alt="NSS Solar" class="login-logo" />
      <h1 class="login-title"><span data-i18n="login.titleMain">NSS Solar </span><span class="login-title-accent" data-i18n="login.titleAccent">管理平台</span></h1>
      <div class="login-subtitle" data-i18n="login.subtitle">流程审批 · 门店运营 · 任务协作</div>
      <form id="loginForm" class="login-panel">
        <label class="field">
          <span class="field-label" data-i18n="login.username">账号</span>
          <span class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.6" stroke="currentColor" stroke-width="1.6"/><path d="M4.8 19.4c1.1-3.2 3.9-4.9 7.2-4.9s6.1 1.7 7.2 4.9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <input name="username" type="text" autocomplete="username" required data-i18n-ph="login.usernamePh" placeholder="请输入账号" />
          </span>
        </label>
        <label class="field">
          <span class="field-label" data-i18n="login.password">密码</span>
          <span class="input-wrap pwd-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="5" y="10.5" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M8.2 10.5V8a3.8 3.8 0 0 1 7.6 0v2.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <input name="password" type="password" autocomplete="current-password" required data-i18n-ph="login.passwordPh" placeholder="请输入密码" />
            <button type="button" class="pwd-toggle" id="pwdToggle" aria-label="Show password">
              <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/></svg>
              <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M2.5 12S6 18.5 12 18.5 21.5 12 21.5 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M6 15.5l-1.6 2.6M12 16.5v3M18 15.5l1.6 2.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            </button>
          </span>
        </label>
        <div id="loginError" class="login-error"></div>
        <button type="submit" class="login-submit" id="loginSubmit" data-i18n="login.submit">登 录</button>
      </form>
    </div>
  </div>

  <!-- ============ 主应用 / App shell ============ -->
  <div id="appShell" class="app-shell hidden">
    <aside class="sidebar">
      <div class="logo-row">
        <img src="/logo-white.png" alt="NSS Solar" class="brand-logo" />
      </div>
      <div class="nav-item nav-item-primary" data-screen="controlCenter">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 5.5h16v13H4zM8 9h8M8 12h5M8 15h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span data-i18n="nav.controlCenter">中控平台</span>
        <span class="nav-primary-arrow" aria-hidden="true">›</span>
      </div>
      <div class="nav-group">
        <div class="nav-group-label" data-i18n="nav.groupOrganization">组织与人员</div>
        <div class="nav-item" data-screen="controlCenter" data-workspace="org">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="9" y="3" width="6" height="4.5" rx="1.2" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="16.5" width="6" height="4.5" rx="1.2" stroke="currentColor" stroke-width="1.8"/><rect x="15" y="16.5" width="6" height="4.5" rx="1.2" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5v4.5M12 12H6v4.5M12 12h6v4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span data-i18n="nav.organization">组织架构</span>
        </div>
      </div>
      <div class="nav-group">
        <div class="nav-group-label" data-i18n="nav.groupDailyOps">业务协同</div>
        <div class="nav-item" data-screen="controlCenter" data-workspace="approvals"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 11l3 3 8-8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span data-i18n="nav.workspaceApprovals">审批中心</span><span class="nav-count" id="navApprovalCount" hidden></span></div>
        <div class="nav-item" data-screen="controlCenter" data-workspace="collaboration"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="4.5" width="18" height="16" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M8 2.5v4M16 2.5v4M3 10h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span data-i18n="nav.workspaceTasks">任务协作</span><span class="nav-count" id="navTaskCount" hidden></span></div>
        <div class="nav-item" data-screen="stores">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4.5 9l1.2-4.5h12.6L19.5 9" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M5 9v9.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9" stroke="currentColor" stroke-width="1.8"/><path d="M5 9c0 1.3 1.1 2.3 2.5 2.3S10 10.3 10 9c0 1.3 1.1 2.3 2.5 2.3S15 10.3 15 9c0 1.3 1.1 2.3 2.5 2.3S20 10.3 20 9" stroke="currentColor" stroke-width="1.8"/><path d="M10 19.5v-5h4v5" stroke="currentColor" stroke-width="1.8"/></svg>
          <span data-i18n="nav.stores">门店管理</span>
        </div>
        <div class="nav-item" data-screen="controlCenter" data-workspace="storeops"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M2.5 12h4l2.5-6.5 3.5 13 2.5-6.5h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="nav.workspaceStoreOps">门店跟进</span></div>
        <div class="nav-item" data-screen="dailyDeposits"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.5 9.5 12 5l8.5 4.5M5.5 10.5v7M9.8 10.5v7M14.2 10.5v7M18.5 10.5v7M3.5 19.5h17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="nav.dailyDeposits">门店资金上报</span></div>
        <div class="nav-group-label" data-i18n="nav.groupSupply">供应链</div>
        <div class="nav-item" data-screen="controlCenter" data-workspace="purchasing"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M2.5 8h11v9h-11z" stroke="currentColor" stroke-width="1.8"/><path d="M13.5 11h4l3 3v3h-7z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="6" cy="18.5" r="1.8" stroke="currentColor" stroke-width="1.6"/><circle cx="17" cy="18.5" r="1.8" stroke="currentColor" stroke-width="1.6"/></svg><span data-i18n="nav.workspacePurchasing">采购跟单</span><span class="nav-count" id="navPurchaseCount" hidden></span></div>
        <div class="nav-group-label" data-i18n="nav.groupCommunications">沟通与通知</div>
        <div class="nav-item" data-screen="controlCenter" data-workspace="announcements"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3.5 10.5v3a1 1 0 0 0 1 1h2.5l5 3.5v-11l-5 3.5H4.5a1 1 0 0 0-1 1z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M16.5 8.5a4.5 4.5 0 0 1 0 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span data-i18n="nav.workspaceAnnouncements">内容公告</span><span class="nav-count nav-count-neutral" id="navAnnouncementCount" hidden></span></div>
      </div>
      <div class="nav-group nav-group-system">
        <div class="nav-group-label" data-i18n="nav.groupSystemAudit">系统与审计</div>
        <div class="nav-item" data-screen="accounts">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="4.5" width="18" height="15" rx="3" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="11" r="2.4" stroke="currentColor" stroke-width="1.8"/><path d="M5.6 17c.5-1.7 1.8-2.6 3.4-2.6s2.9.9 3.4 2.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M15.5 10h3M15.5 13.5h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span data-i18n="nav.accounts">账号管理</span><span class="nav-count nav-count-neutral" id="navAccountCount" hidden></span>
        </div>
        <div class="nav-item" data-screen="controlCenter" data-workspace="governance"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M7 12h10M10 18h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span data-i18n="nav.workspaceGovernance">审批与流程设置</span></div>
        <div class="nav-item" data-screen="db">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><ellipse cx="12" cy="6" rx="7" ry="3" stroke="currentColor" stroke-width="1.8"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6" stroke="currentColor" stroke-width="1.8"/><path d="M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3" stroke="currentColor" stroke-width="1.8"/></svg>
          <span data-i18n="nav.db">数据维护</span>
        </div>
        <div class="nav-item" data-screen="audit">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M7 3.5h7.5L19 8v12.5H7z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 3.5V8h5" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 12h6M10 15.5h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span data-i18n="nav.audit">审计日志</span>
        </div>
      </div>
      <div class="sidebar-spacer"></div>
      <div class="user-block" id="userBlock">
        <div class="user-avatar" id="userAvatar">A</div>
        <div class="user-text">
          <div class="user-name" id="userName">—</div>
          <div class="user-role"><span class="user-online-dot" aria-hidden="true"></span><span id="userRole">—</span></div>
        </div>
        <span class="user-chevron" aria-hidden="true">›</span>
      </div>
    </aside>

    <main class="main">
      <header class="header">
        <button class="icon-btn nav-toggle" id="navToggle" type="button" data-i18n-title="nav.menu" title="Menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3.5 6.5h17M3.5 12h17M3.5 17.5h17" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
        </button>
        <div class="page-crumb" id="headerTitle"></div>
        <div class="header-spacer"></div>
        <button class="icon-btn theme-toggle" id="themeToggle" type="button" aria-label="切换深色模式" title="切换深色模式">◐</button>
        <button class="lang-btn" id="langBtn" data-lang-label type="button" title=""></button>
        <button class="icon-btn" id="logoutBtn" data-i18n-title="header.logout" title="Sign out">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M16 17l5-5-5-5M21 12H9M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </header>

      <div class="content" id="content"></div>
    </main>

    <div class="nav-backdrop" id="navBackdrop"></div>
  </div>

  <div id="modalRoot" class="modal-root hidden"></div>

<script src="/i18n.js?v=32"></script>
  <script src="/app.js?v=78"></script>
  <script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/service-worker.js').catch(() => {}));</script>
</body>
</html>
